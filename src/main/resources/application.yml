server:
  port: 8084
  # Al recibir SIGTERM (docker service update / scale down) termina las peticiones en curso
  shutdown: graceful

spring:
  application:
    name: ms-talleres
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Secretos de Docker Swarm montados en /run/secrets: cada archivo es una propiedad
  # (por ejemplo spring.datasource.password). Si no existen se usan las variables de entorno.
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:talleres_db}
    username: ${DB_USERNAME:respirar}
    password: ${DB_PASSWORD:respirar}
    hikari:
      # Pool chico: con varias réplicas por servicio, todas comparten la misma instancia RDS
      maximum-pool-size: ${DB_POOL_SIZE:4}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  servicio: ms-talleres
  version: ${APP_VERSION:local}
